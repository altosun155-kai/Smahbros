<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f0f17" />
  <meta name="view-transition" content="same-origin" />
  <title>Smash Bracket — Dashboard</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/auth.js"></script>
  <style>
    /* ═══════════════════════════════════════════════
       SHARED — ambient bg, noise, and .glass now come from style.css
    ═══════════════════════════════════════════════ */

    /* ═══════════════════════════════════════════════
       DESKTOP  (≥ 701px)
    ═══════════════════════════════════════════════ */
    /* Invite banners */
    .invite-card { border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .invite-dot  { width: 10px; height: 10px; background: var(--accent-neg); border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px var(--accent-neg); animation: pulseDot 1.6s ease-in-out infinite; }
    .invite-info { flex: 1; min-width: 0; }
    .invite-from { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
    .invite-name { font-size: 0.95rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .invite-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .invite-view { background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 0.82rem; cursor: pointer; text-decoration: none; }
    .invite-view:hover { background: #c5cfdc; }
    .invite-dismiss { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 12px; font-size: 0.82rem; cursor: pointer; }
    .invite-dismiss:hover { color: var(--accent-neg); border-color: rgba(231,76,60,0.4); }
    @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(.8)} }

    .alert-time { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

    /* Section label */
    .section-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin: 24px 0 10px; }

    /* Hide mobile-only elements on desktop */
    .mobile-only { display: none !important; }
    #bottomNav   { display: none !important; }

    /* ── Home shell — champion background, 3-column cinematic menu ── */
    .home-shell {
      position: relative;
      min-height: 78vh;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 4px;
    }
    .home-bg {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: right center;
      filter: brightness(0.3);
      z-index: 0;
      /* Baseline overscan so the JS-driven parallax translate (desktop only,
         see waitForServerThenLoadHome's mousemove listener) never reveals an
         edge -- the scale margin absorbs the small pointer-tracked offset. */
      transform: scale(1.06);
      transition: transform 0.3s ease-out;
    }
    .home-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 30%, rgba(15,15,23,0.55) 55%, transparent 78%);
    }
    .home-elo-badge {
      position: relative; z-index: 2;
      display: inline-flex; align-items: baseline; gap: 5px;
      margin: 20px 0 0 28px;
      font-family: var(--font-display);
      font-size: 1.1rem; font-weight: 800; color: var(--accent-gold);
    }
    .home-elo-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }

    .home-grid {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 300px 1fr 260px;
      gap: 36px;
      padding: 28px 28px 40px;
      min-height: 78vh;
      box-sizing: border-box;
      align-items: start;
    }

    .home-menu { display: flex; flex-direction: column; gap: 6px; }
    .home-menu-primary { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .home-menu-item {
      display: block;
      text-decoration: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .home-menu-item .hmi-sub { display: block; font-family: var(--font-system); font-size: 0.72rem; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
    .home-menu-item.highlighted {
      color: var(--text);
      background: rgba(245,166,35,0.12);
      border-color: rgba(245,166,35,0.4);
    }
    .home-menu-item:hover, .home-menu-item:focus-visible { background: rgba(255,255,255,0.06); color: var(--text); outline: none; }
    .home-menu-item.highlighted:hover, .home-menu-item.highlighted:focus-visible { background: rgba(245,166,35,0.2); }

    .home-menu-secondary { display: flex; flex-direction: column; }
    .home-menu-secondary-item {
      display: block;
      text-decoration: none;
      background: none;
      border: none;
      border-top: 1px solid var(--border);
      text-align: left;
      padding: 11px 4px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .home-menu-secondary-item:last-child { border-bottom: 1px solid var(--border); }
    .home-menu-secondary-item:hover, .home-menu-secondary-item:focus-visible { color: var(--text); background: rgba(255,255,255,0.04); outline: none; }

    .home-panel {
      min-height: 240px;
      padding-top: 6px;
    }
    .home-panel-content { transition: opacity 0.15s ease; }
    .home-panel-content.fading { opacity: 0; }
    .home-panel-loading { color: var(--text-muted); font-size: 0.85rem; }
    .home-panel-eyebrow { font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent-gold); margin-bottom: 8px; }
    .home-panel-title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .home-panel-sub { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 14px; }
    .home-panel-cta { display: inline-block; margin-top: 6px; }

    .home-posters { display: flex; flex-direction: column; gap: 14px; }
    .home-posters .bounty-poster { width: 100%; }

    /* Stagger-in on page entry. Plain CSS (no shared-element morph involved,
       unlike the GSAP stagger used for the draft reveal) -- the sitewide
       prefers-reduced-motion rule in style.css already collapses this to
       near-instant, no extra guard needed here. */
    @keyframes homeItemIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .home-menu-item, .home-menu-secondary-item { opacity: 0; animation: homeItemIn 0.35s ease forwards; }
    .home-menu-primary .home-menu-item:nth-child(1) { animation-delay: 0ms; }
    .home-menu-primary .home-menu-item:nth-child(2) { animation-delay: 40ms; }
    .home-menu-secondary .home-menu-secondary-item:nth-child(1) { animation-delay: 0ms; }
    .home-menu-secondary .home-menu-secondary-item:nth-child(2) { animation-delay: 40ms; }
    .home-menu-secondary .home-menu-secondary-item:nth-child(3) { animation-delay: 80ms; }
    .home-menu-secondary .home-menu-secondary-item:nth-child(4) { animation-delay: 120ms; }
    .home-menu-secondary .home-menu-secondary-item:nth-child(5) { animation-delay: 160ms; }
    .home-menu-secondary .home-menu-secondary-item:nth-child(6) { animation-delay: 200ms; }

    /* ═══════════════════════════════════════════════
       MOBILE  (≤ 700px)
    ═══════════════════════════════════════════════ */
    @media (max-width: 700px) {
      /* Hide desktop elements on mobile */
      .desktop-only { display: none !important; }
      .mobile-only  { display: block !important; }

      /* Make room for fixed bottom nav */
      main.page-container { padding-bottom: 80px !important; padding-top: 0 !important; }

      /* ── Mobile home shell ── */
      .home-shell {
        border-radius: 0;
        margin: 0 -16px 0;
        min-height: unset;
      }
      .home-bg { filter: brightness(0.22); }
      .home-bg::after { background: linear-gradient(180deg, rgba(15,15,23,0.55) 0%, var(--bg) 60%); }
      .home-elo-badge { margin: 16px 0 0 16px; }

      .home-grid {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 16px 16px 24px;
        min-height: unset;
      }

      .home-menu-secondary { display: none; }
      .home-menu-primary { margin-bottom: 0; gap: 10px; }
      .home-menu-item {
        padding: 16px 18px;
        border-radius: 14px;
      }
      .home-menu-item.highlighted .hmi-context {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-muted);
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.08);
      }
      .hmi-context { display: none; }

      .home-panel { display: none; }

      .home-posters {
        flex-direction: row;
        overflow-x: auto;
        gap: 14px;
        padding-bottom: 6px;
        scroll-snap-type: x mandatory;
        scroll-padding-inline: 4px;
        scrollbar-width: none;
      }
      .home-posters::-webkit-scrollbar { display: none; }
      .home-posters .bounty-poster { flex-shrink: 0; width: 200px; scroll-snap-align: start; }

      /* ── Mobile invite banner ── */
      #mobileInviteBanner {
        margin: 12px 0 0;
        border-radius: 14px;
        overflow: hidden;
      }
      .mobile-invite-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        background: linear-gradient(90deg, rgba(176,188,206,.15), rgba(176,188,206,.08));
        border: 1.5px solid rgba(176,188,206,.35);
        border-radius: 14px;
        margin-bottom: 8px;
      }
      .mobile-invite-item .inv-dot {
        width: 8px; height: 8px; border-radius: 50%; background: var(--accent-neg);
        box-shadow: 0 0 6px var(--accent-neg);
        animation: pulseDot 1.4s ease-in-out infinite;
        flex-shrink: 0;
      }
      .mobile-invite-item .inv-text { flex: 1; min-width: 0; }
      .mobile-invite-item .inv-by   { font-size: 0.6rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-muted); }
      .mobile-invite-item .inv-name { font-size: 0.9rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mobile-invite-item .inv-btn  { flex-shrink: 0; background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-weight: 800; font-size: 0.82rem; cursor: pointer; text-decoration: none; }
      .mobile-invite-item .inv-x    { flex-shrink: 0; background: none; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; color: rgba(255,255,255,.4); padding: 9px 10px; font-size: 0.8rem; cursor: pointer; }

      .section-label { margin: 18px 0 8px; }

      /* ── Bottom Nav ── */
      #bottomNav {
        display: flex !important;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 60px;
        background: rgba(13,13,26,.96);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-top: 1px solid rgba(255,255,255,.1);
        z-index: 600;
        align-items: stretch;
      }
      .bnav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        text-decoration: none;
        color: rgba(255,255,255,.38);
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: .3px;
        text-transform: uppercase;
        transition: color .15s;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
      }
      .bnav-item.active, .bnav-item:active { color: var(--accent-blue, #b0bcce); }
      .bnav-icon { font-size: 1.35rem; line-height: 1; }
    }
  </style>
</head>
<body>
<script>requireAuth();</script>

<div id="toast-container"></div>
<nav class="navbar" id="main-nav"></nav>

<main class="page-container" style="padding-top:20px;">

  <!-- ══ MOBILE INVITES (mobile only) ══ -->
  <div id="mobileInviteBanner" class="mobile-only" style="display:none !important;"></div>

  <!-- ══ DESKTOP INVITE SECTION ══ -->
  <div id="inviteSection" style="display:none;" class="desktop-only">
    <div class="section-label">🎟 Tournament Invites</div>
    <div id="inviteList"></div>
  </div>

  <!-- ══ HOME SHELL — champion background, 3-column cinematic menu ══ -->
  <div class="home-shell" id="homeShell">
    <div class="home-bg" id="homeBg"></div>

    <div class="home-elo-badge" id="homeEloBadge" style="display:none;">
      <span id="homeEloVal">—</span><span class="home-elo-label">Elo</span>
    </div>

    <div class="home-grid">
      <nav class="home-menu" id="homeMenu" aria-label="Home menu">
        <div class="home-menu-primary" id="homeMenuPrimary"></div>
        <div class="home-menu-secondary" id="homeMenuSecondary"></div>
      </nav>

      <div class="home-panel" id="homePanel">
        <div class="home-panel-content" id="homePanelContent">
          <p class="home-panel-loading">Loading…</p>
        </div>
      </div>

      <div class="home-posters" id="homePosters"></div>
    </div>
  </div>

</main>

<script src="js/api.js"></script>
<script src="js/chars.js"></script>
<script src="js/nav-inject.js"></script>
<script>
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const isMobile = () => window.innerWidth <= 700;

  (async function init() {
    try {
      const me = await apiGet('/users/me');
      if (me) {
        document.getElementById('navUsername').textContent = me.username;
        const avatarUrl = me.avatar_url || `https://api.dicebear.com/9.x/pixel-art/svg?seed=${encodeURIComponent(me.username)}`;
        const navAv = document.getElementById('navAvatar');
        navAv.src = avatarUrl; navAv.style.display = 'block';
      }
    } catch (_) {}

    // Invites
    try {
      const invites = await apiGet('/invites/received');
      if (invites) {
        const pending = invites.filter(i => i.status === 'pending');
        if (pending.length > 0) {
          // Desktop cards
          document.getElementById('inviteSection').style.display = 'block';
          document.getElementById('inviteList').innerHTML = pending.map(inv => `
            <div class="invite-card glass" id="invCard_${inv.id}">
              <div class="invite-dot"></div>
              <div class="invite-info">
                <div class="invite-from">Invited by ${escHtml(inv.inviter)}</div>
                <div class="invite-name">${escHtml(inv.bracket_name)}</div>
              </div>
              <div class="invite-actions">
                <a href="tournament.html?id=${inv.bracket_id}" class="invite-view">View →</a>
                <button type="button" class="invite-dismiss" onclick="dismissInvite(${inv.id},'invCard_${inv.id}')">✕</button>
              </div>
            </div>
          `).join('');

          // Mobile invite items (below hero)
          const mob = document.getElementById('mobileInviteBanner');
          mob.removeAttribute('style');
          mob.innerHTML = pending.map(inv => `
            <div class="mobile-invite-item" id="mobInv_${inv.id}">
              <div class="inv-dot"></div>
              <div class="inv-text">
                <div class="inv-by">From ${escHtml(inv.inviter)}</div>
                <div class="inv-name">${escHtml(inv.bracket_name)}</div>
              </div>
              <a href="tournament.html?id=${inv.bracket_id}" class="inv-btn">View →</a>
              <button type="button" class="inv-x" onclick="dismissInvite(${inv.id},'mobInv_${inv.id}','invCard_${inv.id}')">✕</button>
            </div>
          `).join('');

          // Badge on bottom nav friends? No — put it on invites
          const bnavItem = document.querySelector('.bnav-item[href="index.html"]');
          if (bnavItem && pending.length) {
            bnavItem.querySelector('.bnav-icon').textContent = '🏠';
          }
        }
      }
    } catch (_) {}
  })();

  function dismissInvite(id, ...elIds) {
    elIds.forEach(elId => document.getElementById(elId)?.remove());
    apiPatch(`/invites/${id}`, { status: 'declined' }).catch(() => {});
    // hide sections if empty
    const list = document.getElementById('inviteList');
    if (list && !list.children.length) document.getElementById('inviteSection').style.display = 'none';
    const mob = document.getElementById('mobileInviteBanner');
    if (mob && !mob.children.length) mob.style.cssText = 'display:none !important;';
  }

  // ── Home shell: one /home/summary call drives the champion background,
  // the menu, the detail panel, and the poster column. ──

  function timeAgoFrom(iso) {
    if (!iso) return '';
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  function posterHtml(r) {
    const wImg = typeof charImgUrl === 'function' ? charImgUrl(r.winner_char) : '';
    const lImg = typeof charImgUrl === 'function' ? charImgUrl(r.loser_char) : '';
    const ago = timeAgoFrom(r.created_at);
    return [
      `<div class="bounty-poster" style="background-image:url('${wImg}')">
        <div class="bp-top">
          <div class="bp-header">WANTED</div>
          <div class="bp-doa">☠ Dead or Alive ☠</div>
        </div>
        <div class="bp-bottom">
          <div class="bp-name">${escHtml(r.winner)}</div>
          <div class="bp-char">${escHtml(r.winner_char)}</div>
          <div class="bp-crime">3-Stocked ${escHtml(r.loser)}</div>
          <div class="bp-time">${ago}</div>
        </div>
      </div>`,
      `<div class="bounty-poster tombstone-poster" style="background-image:url('${lImg}')">
        <div class="bp-top"><div class="bp-header">R.I.P.</div></div>
        <div class="bp-bottom">
          <div class="bp-sublabel">Here lies</div>
          <div class="bp-name">${escHtml(r.loser)}</div>
          <div class="bp-char">${escHtml(r.loser_char)}</div>
          <div class="bp-crime">3-Stocked by ${escHtml(r.winner)}</div>
          <div class="bp-time">${ago}</div>
        </div>
      </div>`,
    ];
  }

  let _homeSummary = null;

  function panelContentFor(key) {
    const s = _homeSummary;
    if (!s) return '<p class="home-panel-loading">Loading…</p>';

    if (key === 'primary') {
      if (s.in_progress) {
        const ip = s.in_progress;
        const href = ip.type === 'draft' ? `/draft/${ip.id}` : `tournament.html?id=${ip.id}`;
        return `<div class="home-panel-eyebrow">In Progress</div>
          <div class="home-panel-title">${escHtml(ip.name)}</div>
          <div class="home-panel-sub">${escHtml(ip.round_or_progress || '')} · Host ${escHtml(ip.leader)}</div>
          <a href="${href}" class="btn btn-primary home-panel-cta">Continue →</a>`;
      }
      if (s.last_session) {
        const ls = s.last_session;
        return `<div class="home-panel-eyebrow">Last Session</div>
          <div class="home-panel-title">${escHtml(ls.name)}</div>
          <div class="home-panel-sub">${ls.winner ? escHtml(ls.winner) + ' won' : 'No winner recorded'} · ${timeAgoFrom(ls.ended_at)}</div>
          <a href="bracket.html" class="btn btn-primary home-panel-cta">New Tournament →</a>`;
      }
      return `<div class="home-panel-eyebrow">Get Started</div>
        <div class="home-panel-title">Start your first tournament</div>
        <div class="home-panel-sub">Single-elimination with elo rewards.</div>
        <a href="bracket.html" class="btn btn-primary home-panel-cta">New Tournament →</a>`;
    }

    if (key === 'duel') {
      if (s.last_duel) {
        const d = s.last_duel;
        return `<div class="home-panel-eyebrow">1v1 Duel</div>
          <div class="home-panel-title">${d.result === 'W' ? 'Beat' : 'Lost to'} ${escHtml(d.opponent)}</div>
          <div class="home-panel-sub">Head-to-head record ${escHtml(d.record)} · ${timeAgoFrom(d.played_at)}</div>
          <a href="duel.html" class="btn btn-primary home-panel-cta">Play a Duel →</a>`;
      }
      return `<div class="home-panel-eyebrow">1v1 Duel</div>
        <div class="home-panel-title">Head-to-head</div>
        <div class="home-panel-sub">Live elo and stock multipliers.</div>
        <a href="duel.html" class="btn btn-primary home-panel-cta">Play a Duel →</a>`;
    }

    if (key === 'leaderboard') {
      const c = s.champion;
      return `<div class="home-panel-eyebrow">Leaderboard</div>
        <div class="home-panel-title">${c ? escHtml(c.username) : 'No champion yet'}</div>
        <div class="home-panel-sub">${c ? `${c.player_elo} elo · ${escHtml(c.character || '—')}` : 'Play a match to get on the board.'}</div>
        <a href="leaderboard.html" class="btn btn-primary home-panel-cta">View Leaderboard →</a>`;
    }

    if (key === 'mastery') {
      const played = s.mastery_coverage ? s.mastery_coverage.played : 0;
      const total = (typeof SMASH_ROSTER !== 'undefined' && SMASH_ROSTER.length) || 0;
      const pct = total ? Math.round((played / total) * 100) : 0;
      return `<div class="home-panel-eyebrow">Mastery</div>
        <div class="home-panel-title">${played}${total ? `/${total}` : ''} characters played</div>
        <div class="home-panel-sub">${total ? `${pct}% roster coverage` : 'Who owns each character.'}</div>
        <a href="mastery.html" class="btn btn-primary home-panel-cta">View Mastery →</a>`;
    }

    if (key === 'tier-list') {
      return `<div class="home-panel-eyebrow">Tier List</div>
        <div class="home-panel-title">Rank the roster</div>
        <div class="home-panel-sub">Rank all fighters your way.</div>
        <a href="tier-list.html" class="btn btn-primary home-panel-cta">Open Tier List →</a>`;
    }

    if (key === 'favorites') {
      return `<div class="home-panel-eyebrow">Favorites</div>
        <div class="home-panel-title">Your top picks</div>
        <div class="home-panel-sub">Top 10 for auto-fill.</div>
        <a href="favorites.html" class="btn btn-primary home-panel-cta">Open Favorites →</a>`;
    }

    if (key === 'profile') {
      return `<div class="home-panel-eyebrow">Profile</div>
        <div class="home-panel-title">Your profile</div>
        <div class="home-panel-sub">Match history and badges.</div>
        <a href="profile.html" class="btn btn-primary home-panel-cta">Open Profile →</a>`;
    }

    if (key === 'signout') {
      return `<div class="home-panel-eyebrow">Sign Out</div>
        <div class="home-panel-title">See you next time</div>
        <div class="home-panel-sub">Sign out of this session.</div>`;
    }

    return '';
  }

  // Crossfades the panel at ~150ms -- the panel's own min-height (CSS) is
  // what actually stops it reflowing as content length changes between items.
  function setPanelContent(key) {
    const el = document.getElementById('homePanelContent');
    el.classList.add('fading');
    setTimeout(() => {
      el.innerHTML = panelContentFor(key);
      el.classList.remove('fading');
    }, 150);
  }

  function wireMenuItem(el, key) {
    if (!el) return;
    el.addEventListener('mouseenter', () => setPanelContent(key));
    el.addEventListener('focus', () => setPanelContent(key));
  }

  // Arrow keys move the highlight across the unified primary+secondary list;
  // Enter is native <a> behavior already, nothing extra needed for it.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const active = document.activeElement;
    if (!active || !active.closest || !active.closest('#homeMenu')) return;
    const items = Array.from(document.querySelectorAll('#homeMenu .home-menu-item, #homeMenu .home-menu-secondary-item'));
    const idx = items.indexOf(active);
    if (idx === -1) return;
    e.preventDefault();
    const next = e.key === 'ArrowDown' ? items[idx + 1] || items[0] : items[idx - 1] || items[items.length - 1];
    next.focus();
  });

  async function loadHomeSummary() {
    try {
      const s = await apiGet('/home/summary');
      _homeSummary = s;

      if (s.champion && s.champion.character && typeof charImgUrl === 'function') {
        document.getElementById('homeBg').style.backgroundImage = `url('${charImgUrl(s.champion.character)}')`;
      }
      if (s.champion) {
        document.getElementById('homeEloVal').textContent = s.champion.player_elo;
        document.getElementById('homeEloBadge').style.display = 'inline-flex';
      }

      const primaryTop = s.in_progress
        ? { label: 'Continue', sub: s.in_progress.name, href: s.in_progress.type === 'draft' ? `/draft/${s.in_progress.id}` : `tournament.html?id=${s.in_progress.id}`,
            context: `${s.in_progress.round_or_progress || ''} · Host ${s.in_progress.leader}` }
        : { label: 'New Tournament', sub: 'Single-elimination with elo rewards.', href: 'bracket.html',
            context: s.last_session ? `Last: ${s.last_session.name} — ${s.last_session.winner ? s.last_session.winner + ' won' : 'no winner recorded'} · ${timeAgoFrom(s.last_session.ended_at)}` : '' };

      // .hmi-context is desktop-hidden (the detail panel already shows this) and
      // mobile-visible (mobile has no hover, so context has to live in the card).
      document.getElementById('homeMenuPrimary').innerHTML = `
        <a href="${primaryTop.href}" class="home-menu-item highlighted" id="homeItemPrimary">${escHtml(primaryTop.label)}<span class="hmi-sub">${escHtml(primaryTop.sub)}</span>${primaryTop.context ? `<span class="hmi-context">${escHtml(primaryTop.context)}</span>` : ''}</a>
        <a href="duel.html" class="home-menu-item" id="homeItemDuel">1v1 Duel<span class="hmi-sub">Head-to-head with live elo.</span></a>`;
      wireMenuItem(document.getElementById('homeItemPrimary'), 'primary');
      wireMenuItem(document.getElementById('homeItemDuel'), 'duel');

      const SECONDARY = [
        { key: 'leaderboard', label: 'Leaderboard', href: 'leaderboard.html' },
        { key: 'mastery', label: 'Mastery', href: 'mastery.html' },
        { key: 'tier-list', label: 'Tier List', href: 'tier-list.html' },
        { key: 'favorites', label: 'Favorites', href: 'favorites.html' },
        { key: 'profile', label: 'Profile', href: 'profile.html' },
        { key: 'signout', label: 'Sign Out', href: '#' },
      ];
      document.getElementById('homeMenuSecondary').innerHTML = SECONDARY.map((item) =>
        `<a href="${item.href}" class="home-menu-secondary-item" id="homeItem_${item.key}"${item.key === 'signout' ? ' onclick="logout();return false;"' : ''}>${escHtml(item.label)}</a>`
      ).join('');
      SECONDARY.forEach((item) => wireMenuItem(document.getElementById(`homeItem_${item.key}`), item.key));

      setPanelContent('primary');

      const postersEl = document.getElementById('homePosters');
      postersEl.innerHTML = s.posters && s.posters.length
        ? s.posters.flatMap(posterHtml).join('')
        : '<div style="font-size:0.8rem;color:var(--text-muted);">No 3-stocks yet — stay strapped.</div>';
    } catch (err) {
      document.getElementById('homePanelContent').innerHTML = '<p class="home-panel-loading">Could not load home data.</p>';
    }
  }

  // Same cold-start gate as login.html's waitForServer() -- /home/summary
  // shouldn't be the thing that eats a ~30s Render wake-up with no feedback.
  async function waitForServerThenLoadHome() {
    for (let i = 0; i < 10; i++) {
      try {
        const r = await fetch(API_BASE + '/health', { cache: 'no-store' });
        if (r.ok) { loadHomeSummary(); return; }
      } catch (_) {}
      await new Promise((res) => setTimeout(res, i === 0 ? 2000 : 10000));
    }
    loadHomeSummary();
  }
  waitForServerThenLoadHome();

  // Subtle mouse-driven parallax on the champion background -- desktop only,
  // skipped entirely under prefers-reduced-motion (a JS-driven transform isn't
  // reached by style.css's blanket animation/transition collapse, same gap
  // handled for the draft reveal's Flip tween and the login shatter earlier
  // this session).
  if (window.innerWidth > 700 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let rafPending = false;
    document.addEventListener('mousemove', (e) => {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        const bg = document.getElementById('homeBg');
        if (!bg) return;
        const xPct = (e.clientX / window.innerWidth - 0.5) * 2;
        const yPct = (e.clientY / window.innerHeight - 0.5) * 2;
        bg.style.transform = `scale(1.06) translate(${xPct * -1.5}%, ${yPct * -1.5}%)`;
      });
    });
  }
</script>
