<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f0f17" />
  <meta name="view-transition" content="same-origin" />
  <title>Smash Bracket — Dashboard</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/game-menu.css" />
  <script src="js/auth.js"></script>
  <style>
    /* ═══════════════════════════════════════════════
       SHARED — ambient bg, noise, and .glass now come from style.css
    ═══════════════════════════════════════════════ */

    /* ═══════════════════════════════════════════════
       DESKTOP  (≥ 701px)
    ═══════════════════════════════════════════════ */
    /* Invite banners */
    .invite-card { border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .invite-dot  { width: 10px; height: 10px; background: var(--accent-neg); border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px var(--accent-neg); animation: pulseDot 1.6s ease-in-out infinite; }
    .invite-info { flex: 1; min-width: 0; }
    .invite-from { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
    .invite-name { font-size: 0.95rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .invite-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .invite-view { background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 0.82rem; cursor: pointer; text-decoration: none; }
    .invite-view:hover { background: #c5cfdc; }
    .invite-dismiss { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 12px; font-size: 0.82rem; cursor: pointer; }
    .invite-dismiss:hover { color: var(--accent-neg); border-color: rgba(231,76,60,0.4); }
    @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(.8)} }

    .alert-time { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

    /* Section label */
    .section-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin: 24px 0 10px; }

    /* Hide mobile-only elements on desktop */
    .mobile-only { display: none !important; }
    #bottomNav   { display: none !important; }

    /* ═══════════════════════════════════════════════
       MOBILE  (≤ 700px)
    ═══════════════════════════════════════════════ */
    @media (max-width: 700px) {
      /* Hide desktop elements on mobile */
      .desktop-only { display: none !important; }
      .mobile-only  { display: block !important; }

      /* Make room for fixed bottom nav */
      main.page-container { padding-bottom: 80px !important; padding-top: 0 !important; }

      /* ── Mobile invite banner ── */
      #mobileInviteBanner {
        margin: 12px 0 0;
        border-radius: 14px;
        overflow: hidden;
      }
      .mobile-invite-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        background: linear-gradient(90deg, rgba(176,188,206,.15), rgba(176,188,206,.08));
        border: 1.5px solid rgba(176,188,206,.35);
        border-radius: 14px;
        margin-bottom: 8px;
      }
      .mobile-invite-item .inv-dot {
        width: 8px; height: 8px; border-radius: 50%; background: var(--accent-neg);
        box-shadow: 0 0 6px var(--accent-neg);
        animation: pulseDot 1.4s ease-in-out infinite;
        flex-shrink: 0;
      }
      .mobile-invite-item .inv-text { flex: 1; min-width: 0; }
      .mobile-invite-item .inv-by   { font-size: 0.6rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-muted); }
      .mobile-invite-item .inv-name { font-size: 0.9rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mobile-invite-item .inv-btn  { flex-shrink: 0; background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-weight: 800; font-size: 0.82rem; cursor: pointer; text-decoration: none; }
      .mobile-invite-item .inv-x    { flex-shrink: 0; background: none; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; color: rgba(255,255,255,.4); padding: 9px 10px; font-size: 0.8rem; cursor: pointer; }

      .section-label { margin: 18px 0 8px; }

      /* ── Bottom Nav ── */
      #bottomNav {
        display: flex !important;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 60px;
        background: rgba(13,13,26,.96);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-top: 1px solid rgba(255,255,255,.1);
        z-index: 600;
        align-items: stretch;
      }
      .bnav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        text-decoration: none;
        color: rgba(255,255,255,.38);
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: .3px;
        text-transform: uppercase;
        transition: color .15s;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
      }
      .bnav-item.active, .bnav-item:active { color: var(--accent-blue, #b0bcce); }
      .bnav-icon { font-size: 1.35rem; line-height: 1; }
    }
  </style>
</head>
<body>
<script>requireAuth();</script>

<div id="toast-container"></div>
<nav class="navbar" id="main-nav"></nav>

<main class="page-container" style="padding-top:20px;">

  <!-- ══ MOBILE INVITES (mobile only) ══ -->
  <div id="mobileInviteBanner" class="mobile-only" style="display:none !important;"></div>

  <!-- ══ DESKTOP INVITE SECTION ══ -->
  <div id="inviteSection" style="display:none;" class="desktop-only">
    <div class="section-label">🎟 Tournament Invites</div>
    <div id="inviteList"></div>
  </div>

  <!-- ══ GAME MENU — champion background, 3-column cinematic menu (mode: 'page') ══ -->
  <div id="homeMenuMount"></div>

</main>

<script src="js/api.js"></script>
<script src="js/chars.js"></script>
<script src="js/game-menu.js"></script>
<script src="js/nav-inject.js"></script>
<script>
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const isMobile = () => window.innerWidth <= 700;

  (async function init() {
    try {
      const me = await apiGet('/users/me');
      if (me) {
        document.getElementById('homeIdentityName').textContent = me.username;
        const avatarUrl = me.avatar_url || `https://api.dicebear.com/9.x/pixel-art/svg?seed=${encodeURIComponent(me.username)}`;
        const idAvatar = document.getElementById('homeIdentityAvatar');
        idAvatar.src = avatarUrl; idAvatar.style.display = 'block';
        document.getElementById('homeIdentity').style.display = 'inline-flex';
      }
    } catch (_) {}

    // Invites
    try {
      const invites = await apiGet('/invites/received');
      if (invites) {
        const pending = invites.filter(i => i.status === 'pending');
        if (pending.length > 0) {
          // Desktop cards
          document.getElementById('inviteSection').style.display = 'block';
          document.getElementById('inviteList').innerHTML = pending.map(inv => `
            <div class="invite-card glass" id="invCard_${inv.id}">
              <div class="invite-dot"></div>
              <div class="invite-info">
                <div class="invite-from">Invited by ${escHtml(inv.inviter)}</div>
                <div class="invite-name">${escHtml(inv.bracket_name)}</div>
              </div>
              <div class="invite-actions">
                <a href="tournament.html?id=${inv.bracket_id}" class="invite-view">View →</a>
                <button type="button" class="invite-dismiss" onclick="dismissInvite(${inv.id},'invCard_${inv.id}')">✕</button>
              </div>
            </div>
          `).join('');

          // Mobile invite items (below hero)
          const mob = document.getElementById('mobileInviteBanner');
          mob.removeAttribute('style');
          mob.innerHTML = pending.map(inv => `
            <div class="mobile-invite-item" id="mobInv_${inv.id}">
              <div class="inv-dot"></div>
              <div class="inv-text">
                <div class="inv-by">From ${escHtml(inv.inviter)}</div>
                <div class="inv-name">${escHtml(inv.bracket_name)}</div>
              </div>
              <a href="tournament.html?id=${inv.bracket_id}" class="inv-btn">View →</a>
              <button type="button" class="inv-x" onclick="dismissInvite(${inv.id},'mobInv_${inv.id}','invCard_${inv.id}')">✕</button>
            </div>
          `).join('');

          // Badge on bottom nav friends? No — put it on invites
          const bnavItem = document.querySelector('.bnav-item[href="index.html"]');
          if (bnavItem && pending.length) {
            bnavItem.querySelector('.bnav-icon').textContent = '🏠';
          }
        }
      }
    } catch (_) {}
  })();

  function dismissInvite(id, ...elIds) {
    elIds.forEach(elId => document.getElementById(elId)?.remove());
    apiPatch(`/invites/${id}`, { status: 'declined' }).catch(() => {});
    // hide sections if empty
    const list = document.getElementById('inviteList');
    if (list && !list.children.length) document.getElementById('inviteSection').style.display = 'none';
    const mob = document.getElementById('mobileInviteBanner');
    if (mob && !mob.children.length) mob.style.cssText = 'display:none !important;';
  }

  GameMenu.init({ mode: 'page', container: document.getElementById('homeMenuMount') });

</script>

</body>
</html>
