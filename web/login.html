<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f0f17" />
  <title>Smash Bracket — Sign In</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script src="js/auth.js"></script>
</head>
<body>
<script>redirectIfLoggedIn();</script>

<div id="toast-container"></div>

<div class="auth-page">

  <div class="auth-logo">Smash<span>Bros</span></div>

  <div class="auth-card">

    <div class="auth-error-banner" id="enterError" role="alert"></div>

    <p class="tiles-status" id="tilesStatus">Loading players…</p>
    <div class="user-tiles" id="userTiles"></div>

    <a href="#" class="show-hidden-link" id="showHiddenLink" style="display:none;">show test accounts</a>

    <button type="button" class="tile-btn tile-btn-new" id="newPlayerToggle" style="display:none;">+ New player</button>

    <form id="newPlayerForm" class="new-player-form" novalidate style="display:none;">
      <div class="form-group">
        <label for="newPlayerName">Your name</label>
        <input
          type="text"
          id="newPlayerName"
          name="username"
          placeholder="Your name"
          autocomplete="username"
          maxlength="24"
          required
        />
        <p class="field-error" id="newPlayerNameError">Enter your name.</p>
      </div>

      <button type="submit" class="auth-submit" id="enterBtn">Let's go</button>
    </form>

  </div>
</div>

<script src="js/api.js"></script>
<script>
  // ── Server ready gate ────────────────────────────────────────────────────────
  // Disable the submit button and show a status banner until /health responds.
  const enterBtn = document.getElementById('enterBtn');
  const errorBannerEnter = document.getElementById('enterError');

  function setServerReady(ready) {
    enterBtn.disabled = !ready;
    if (ready) {
      enterBtn.textContent = "Let's go";
      errorBannerEnter.classList.remove('visible');
    } else {
      enterBtn.textContent = 'Connecting to server…';
    }
  }

  async function waitForServer() {
    setServerReady(false);
    for (let i = 0; i < 10; i++) {          // up to ~90 s
      try {
        const r = await fetch(API_BASE + '/health', { cache: 'no-store' });
        if (r.ok) { setServerReady(true); return; }
      } catch (_) {}
      await new Promise(r => setTimeout(r, i === 0 ? 2000 : 10000));
    }
    // Give up waiting — let them try anyway
    setServerReady(true);
    errorBannerEnter.textContent = 'Server may still be starting. If this fails, wait 30 s and try again.';
    errorBannerEnter.classList.add('visible');
  }

  waitForServer();

  // ── Enter (shared by tile click + new-player form) ──────────────────────
  const errorBanner = document.getElementById('enterError');

  async function enter(username, triggerEl, busyText) {
    errorBanner.classList.remove('visible');
    const originalText = triggerEl.textContent;
    triggerEl.disabled = true;
    if (busyText) triggerEl.textContent = busyText;

    try {
      const data = await apiFetch('POST', '/auth/enter', { username }, false);

      setToken(data.token);
      setUsername(data.username);
      const returnUrl = localStorage.getItem('loginReturnUrl');
      localStorage.removeItem('loginReturnUrl');
      window.location.href = returnUrl || 'index.html';
    } catch (err) {
      errorBanner.textContent = err.message || 'Something went wrong.';
      errorBanner.classList.add('visible');
      triggerEl.disabled = false;
      triggerEl.textContent = originalText;
    }
  }

  // ── Player tiles ──────────────────────────────────────
  const tilesStatus = document.getElementById('tilesStatus');
  const userTiles = document.getElementById('userTiles');
  const showHiddenLink = document.getElementById('showHiddenLink');
  const newPlayerToggle = document.getElementById('newPlayerToggle');
  const newPlayerForm = document.getElementById('newPlayerForm');

  function appendTiles(names) {
    names.forEach(function(name) {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'tile-btn';
      tile.dataset.username = name;
      tile.textContent = name;
      tile.addEventListener('click', function() {
        enter(tile.dataset.username, tile, 'One sec…');
      });
      userTiles.appendChild(tile);
    });
  }

  async function loadPlayerTiles() {
    try {
      const data = await apiFetch('GET', '/auth/users', null, false);
      const usernames = data.usernames || [];
      const hiddenUsernames = data.hidden_usernames || [];

      tilesStatus.style.display = 'none';
      appendTiles(usernames);

      if (hiddenUsernames.length) {
        showHiddenLink.style.display = 'inline-block';
        showHiddenLink.addEventListener('click', function(e) {
          e.preventDefault();
          appendTiles(hiddenUsernames);
          showHiddenLink.style.display = 'none';
        });
      }
    } catch (err) {
      tilesStatus.textContent = 'Could not load players. You can still enter a name below.';
    } finally {
      newPlayerToggle.style.display = 'inline-block';
    }
  }

  loadPlayerTiles();

  // ── New player ──────────────────────────────────────
  newPlayerToggle.addEventListener('click', function() {
    newPlayerToggle.style.display = 'none';
    newPlayerForm.style.display = 'block';
    document.getElementById('newPlayerName').focus();
  });

  newPlayerForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('newPlayerName').value.trim();
    const btn = document.getElementById('enterBtn');

    document.getElementById('newPlayerNameError').classList.remove('visible');
    document.getElementById('newPlayerName').classList.remove('input-error');

    if (!username) {
      document.getElementById('newPlayerName').classList.add('input-error');
      document.getElementById('newPlayerNameError').classList.add('visible');
      return;
    }

    enter(username, btn, 'One sec…');
  });

  // Clear errors on input
  document.getElementById('newPlayerName').addEventListener('input', function() {
    this.classList.remove('input-error');
  });
</script>

</body>
</html>
